  - ttll_h5
  branches:
  - eventNumber
  - mcChannelNumber
  - Electron_(pt|eta|phi|e|q)
  - Muon_(pt|eta|phi|e|q)
  - Jet_(pt|eta|phi|e|GN2v01_PCBT_quantile_NOSYS)
  - Met_(pt|phi)
  - Truth_had_b_index
  - Truth_had_bbar_index
  - nBjets_GN2v01_(90|85|77|70|65)_NOSYS
  - is_fully_matched_NOSYS
  - neutrino_vector_NOSYS
  - weight_total_NOSYS
  - weight_mc_NOSYS
samples:
- name: kk574797_mc20a_pilot_vyper
