  - mu
regions:
- name: ttll_h5
  selection: is_fully_matched_NOSYS == 1 && region_name_NOSYS == ("2l") && SingleLepton_pass_triggers_NOSYS
    == 1 && n_jets_NOSYS >= 2 && n_bjets_NOSYS >= 1 && neutrino_both_nonzero_NOSYS == 1
  variables:
  - name: n_jet
    type: unsigned long
    title: Number of selected jets; nJets; Events
    definition: n_jets_NOSYS
    binning:
      min: -0.5
      max: 15.5
      number_of_bins: 16
ntuples:
