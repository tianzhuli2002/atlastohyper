general:
  debug_level: INFO
  input_filelist_path: "../../metadata/filelist.txt"
  input_sumweights_path: "../../metadata/sum_of_weights.txt"
  output_path_histograms: "/home/dbaronmo/Work/resultsTopRecoAllHadronic"
  output_path_ntuples: "/home/dbaronmo/Work/resultsTopRecoAllHadronic"
  default_sumweights: "NOSYS"
  default_event_weights: "weight_mc_NOSYS"
  default_reco_tree_name: "reco"
  luminosity:
    mc23a: 26071.4
    mc23d: 25767.5
  xsection_files: 
    - campaigns: ["mc20a", "mc20d", "mc20e"]
      files:
        - /cvmfs/atlas.cern.ch/repo/sw/database/GroupData/dev/PMGTools/PMGxsecDB_mc23.txt
        - /cvmfs/atlas.cern.ch/repo/sw/database/GroupData/dev/PMGTools/PMGxsecDB_mc16.txt
    - campaigns: ["mc23a","mc23d"]
      files:
        - /cvmfs/atlas.cern.ch/repo/sw/database/GroupData/dev/PMGTools/PMGxsecDB_mc23.txt
        - /cvmfs/atlas.cern.ch/repo/sw/database/GroupData/dev/PMGTools/PMGxsecDB_mc16.txt
  custom_frame_name: "PartonMatcher"
  custom_options:
    class_name: "TtbarTopRecoFrame"
  automatic_systematics: False
  nominal_only: True
  create_tlorentz_vectors_for: ["jet"]
  config_define_after_custom_class: True
  number_of_cpus: 16
  define_custom_columns:
    - name: "Top_Score_Sum_NOSYS"
      definition: "hyper_TtbarAllHadronic_Top1_Score_NOSYS + hyper_TtbarAllHadronic_Top2_Score_NOSYS"
    - name: "Top_Score_Mul_NOSYS"
      definition: "hyper_TtbarAllHadronic_Top1_Score_NOSYS * hyper_TtbarAllHadronic_Top2_Score_NOSYS"
    - name: "Top_Score_Ratio_NOSYS"
      definition: "hyper_TtbarAllHadronic_Top1_Score_NOSYS / (1+hyper_TtbarAllHadronic_Top2_Score_NOSYS)"
    - name: "Top_Score_Stack_NOSYS"
      definition: "std::vector<float>{hyper_TtbarAllHadronic_Top1_Score_NOSYS,hyper_TtbarAllHadronic_Top2_Score_NOSYS}"
    - name: "Top_Score_Asymm_NOSYS"
      definition: "(hyper_TtbarAllHadronic_Top1_Score_NOSYS - hyper_TtbarAllHadronic_Top2_Score_NOSYS) / (hyper_TtbarAllHadronic_Top1_Score_NOSYS + hyper_TtbarAllHadronic_Top2_Score_NOSYS)"

regions:
  - name: "6Jets"
    selection: "nJets_good_NOSYS == 6 && Passed_Any_Jet_Trigger_NOSYS && pass_sixjets_NOSYS"
    variables: &all_variables
      - name: nJets
        title: Number of jets; N Jets;Events
        definition: nJets_good_NOSYS
        type: int
        binning:
          min: 0
          max: 16
          number_of_bins: 16
      - name: truth_t_mass_afterFSR
        title: Truth top mass after FSR;m_{t} [GeV];Events
        definition: truth_t_mass_afterFSR_NOSYS
        type: float
        binning:
          min: 30
          max: 300
          number_of_bins: 54
      - name: truth_t_mass_afterFSR_from_branch
        title: Truth top mass after FSR;m_{t} [GeV];Events
        definition: Ttbar_History_MC_t_afterFSR_m/1000
        type: float
        binning:
          min: 30
          max: 300
          number_of_bins: 54
      - name: truth_t_mass_beforeFSR
        title: Truth top mass before FSR;m_{t} [GeV];Events
        definition: truth_t_mass_beforeFSR_NOSYS
        type: float
        binning:
          min: 30
          max: 300
          number_of_bins: 54
      - name: truth_tbar_mass_afterFSR
        title: Truth anti-top mass after FSR;m_{t} [GeV];Events
        definition: truth_tbar_mass_afterFSR_NOSYS
        type: float
        binning:
          min: 30
          max: 300
          number_of_bins: 54
      - name: truth_t_mass_afterFSR_from_branch
        title: Truth top mass after FSR;m_{t} [GeV];Events
        definition: Ttbar_History_MC_tbar_afterFSR_m/1000
        type: float
        binning:
          min: 30
          max: 300
          number_of_bins: 54
      - name: truth_tbar_mass_beforeFSR
        title: Truth anti-top mass before FSR;m_{t} [GeV];Events
        definition: truth_tbar_mass_beforeFSR_NOSYS
        type: float
        binning:
          min: 30
          max: 300
          number_of_bins: 54
      - name: truth_W_from_t_mass_afterFSR
        title: Truth W mass from top after FSR;m_{W} [GeV];Events
        definition: truth_W_mass_from_t_afterFSR_NOSYS
        type: float
        binning:
          min: 30
          max: 200
          number_of_bins: 34
      - name: truth_W_from_t_mass_beforeFSR
        title: Truth W mass from top before FSR;m_{W} [GeV];Events
        definition: truth_W_mass_from_t_beforeFSR_NOSYS
        type: float
        binning:
          min: 30
          max: 200
          number_of_bins: 34
      - name: truth_W_from_tbar_mass_afterFSR
        title: Truth W mass from anti-top after FSR;m_{W} [GeV];Events
        definition: truth_W_mass_from_tbar_afterFSR_NOSYS
        type: float
        binning:
          min: 30
          max: 200
          number_of_bins: 34
      - name: truth_W_from_tbar_mass_beforeFSR
        title: Truth W mass from anti-top before FSR;m_{W} [GeV];Events
        definition: truth_W_mass_from_tbar_beforeFSR_NOSYS
        type: float
        binning:
          min: 30
          max: 200
          number_of_bins: 34
      - name: N_corect_W_HyPER
        title: Number of correctly reconstructed W bosons by HyPER; N correct Ws; Events
        definition: Number_W_correctly_reconstructed_HyPER_NOSYS
        type: int
        binning:
          min: -2
          max: 3
          number_of_bins: 5
      - name: N_corect_Top_HyPER
        title: Number of correctly reconstructed Top quarks by HyPER; N correct Tops; Events
        definition: Number_Top_correctly_reconstructed_HyPER_NOSYS
        type: int
        binning:
          min: -2
          max: 3
          number_of_bins: 5
      - name: N_corect_W_KLF
        title: Number of correctly reconstructed W bosons by KLF; N correct Ws; Events
        definition: Number_W_correctly_reconstructed_KLF_NOSYS
        type: int
        binning:
          min: -2
          max: 3
          number_of_bins: 5
      - name: N_corect_Top_KLF
        title: Number of correctly reconstructed Top quarks by KLF; N correct Tops; Events
        definition: Number_Top_correctly_reconstructed_KLF_NOSYS
        type: int
        binning:
          min: -2
          max: 3
          number_of_bins: 5
      - name: Is_Two_Tops_Reco
        title: Two tops reconstructed by HyPER; HyPER(2T); Events
        definition: Two_Tops_Reco_NOSYS
        type: bool
        binning:
          min: 0
          max: 2
          number_of_bins: 2

  - name: "7Jets"
    selection: "nJets_good_NOSYS == 7 && Passed_Any_Jet_Trigger_NOSYS && pass_sixjets_NOSYS"
    variables: *all_variables
  - name: "8Jets"
