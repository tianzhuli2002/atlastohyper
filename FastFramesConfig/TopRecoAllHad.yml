  - name: "10pJets"
    selection: "nJets_good_NOSYS >= 10 && Passed_Any_Jet_Trigger_NOSYS && pass_sixjets_NOSYS"
    variables: *all_variables

  - name: "6Jets_Even"
    selection: "nJets_good_NOSYS == 6 && Passed_Any_Jet_Trigger_NOSYS && pass_sixjets_NOSYS && (eventNumber % 2 == 0)"
    variables: *all_variables
  - name: "7Jets_Even"
    selection: "nJets_good_NOSYS == 7 && Passed_Any_Jet_Trigger_NOSYS && pass_sixjets_NOSYS && (eventNumber % 2 == 0)"
    variables: *all_variables
  - name: "8Jets_Even"
    selection: "nJets_good_NOSYS == 8 && Passed_Any_Jet_Trigger_NOSYS && pass_sixjets_NOSYS && (eventNumber % 2 == 0)"
    variables: *all_variables
  - name: "9Jets_Even"
    selection: "nJets_good_NOSYS == 9 && Passed_Any_Jet_Trigger_NOSYS && pass_sixjets_NOSYS && (eventNumber % 2 == 0)"
    variables: *all_variables
  - name: "10pJets_Even"
