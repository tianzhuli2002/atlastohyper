general:
  debug_level: INFO # Logger level
  input_filelist_path: "../metadata_vyper/filelist.txt" # Path to the metadata relative to fastframes directory
  input_sumweights_path: "../metadata_vyper/sum_of_weights.txt" # Path to the metadata relative to fastframes directory
  output_path_histograms: "../output_histograms_vyper/" # Path to the output histograms relative to fastframes directory
  output_path_ntuples: "../output_ntuples_vyper_new/" # Path to the output ntuples relative to fastframes directory
  default_sumweights: "NOSYS" # Default sum of weights for the samples. This is used to calculate the scaling to the luminosity.
  default_event_weights: "weight_mc_NOSYS * weight_pileup_NOSYS * weight_leptonSF_tight_NOSYS * weight_jvt_effSF_NOSYS" # * weight_ftag_effSF_GN2v01_Continuous_NOSYS"
  default_reco_tree_name: "reco" # Name of the reco tree in the input files.
  xsection_files: # Location of the cross-section, k-factor, filter-efficiency medatada split per campaign.
    - files: ["/cvmfs/atlas.cern.ch/repo/sw/database/GroupData/dev/PMGTools/PMGxsecDB_mc23.txt"]
      campaigns: [ "mc23e", "mc23d"] #"mc23a", "mc23d",
  luminosity: # Luminosity for the campaigns
    # mc23a: 29049.3 # update?
    mc23d: 27239.9 # update?
    mc23e: 25000.0
  automatic_systematics: False
  nominal_only: True # Run with/without systematics.
  #config_define_after_custom_class : True

  use_rvec: True # Use ROOT::RVec instead of std::vector.
  number_of_cpus: 16 # CPU cores to use for the analysis.
  use_region_subfolders: False # Save the histograms in subfolders per region.
  custom_frame_name: "PartonMatcher"
  custom_options:
    class_name: "TtbarDileptonFramevyper"
  #custom_frame_name: "TtbarDileptonFrame" # Name of the custom class.
  create_tlorentz_vectors_for: ["jet", "el", "mu"] # Create TLorentzVectors for the specified objects.
  # custom_options: # Use this to pass custom options to the custom class.
  #   metadata_histogram_name: metadata_ttbardilepton
  #   run_tag: ttbarDilepton_v1
  #   runner: Tim

