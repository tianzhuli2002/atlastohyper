  - name: "ttbar_allhad_2022"
    dsids: [601237]
    campaigns: ["mc23a"]
    simulation_type: "fullsim"
    event_weights: *no_beamspot_weight
  - name: "ttbar_allhad_2018"
    dsids: [410471]
