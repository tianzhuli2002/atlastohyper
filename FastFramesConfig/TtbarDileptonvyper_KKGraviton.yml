# Shape-only Run-2 KK candidate study. Yield normalization is intentionally disabled.
general:
  debug_level: INFO
  input_filelist_path: /home/leet/FF/metadata_kkgraviton/filelist.txt
  input_sumweights_path: /home/leet/FF/metadata_kkgraviton/sum_of_weights.txt
  output_path_histograms: /data/leet/FFTutorial/output_histograms_ttbarDilepton_vyper_KKGraviton
  output_path_ntuples: /data/leet/FFTutorial/output_ntuples_ttbarDilepton_vyper_KKGraviton
  default_sumweights: NOSYS
  default_event_weights: '1.'
  default_reco_tree_name: reco
  xsection_files:
  - campaigns:
    - mc20a
    - mc20d
    - mc20e
    files:
    - /cvmfs/atlas.cern.ch/repo/sw/database/GroupData/dev/PMGTools/PMGxsecDB_mc16.txt
  luminosity:
    mc20a: 36207.66
    mc20d: 44307.4
    mc20e: 58450.1
  automatic_systematics: false
  nominal_only: true
  normalise_to_luminosity: false
  use_rvec: true
  number_of_cpus: 4
  use_region_subfolders: false
  custom_frame_name: PartonMatcher
  custom_options:
    class_name: TtbarDileptonFramevyper
  create_tlorentz_vectors_for:
  - jet
  - el
  - mu
regions:
- name: ttll_h5
  selection: is_fully_matched_NOSYS == 1 && region_name_NOSYS == ("2l") && SingleLepton_pass_triggers_NOSYS == 1
    && n_jets_NOSYS >= 2 && n_bjets_NOSYS >= 1 && neutrino_both_nonzero_NOSYS == 1
  variables:
  - name: n_jet
    type: unsigned long
    title: Number of selected jets; nJets; Events
    definition: n_jets_NOSYS
    binning:
      min: -0.5
      max: 15.5
      number_of_bins: 16
ntuples:
  regions:
  - ttll_h5
  branches:
  - eventNumber
  - mcChannelNumber
  - Electron_(pt|eta|phi|e|q)
  - Muon_(pt|eta|phi|e|q)
  - Jet_(pt|eta|phi|e|GN2v01_PCBT_quantile_NOSYS)
  - Met_(pt|phi)
  - Truth_had_b_index
  - Truth_had_bbar_index
  - nBjets_GN2v01_(90|85|77|70|65)_NOSYS
  - is_fully_matched_NOSYS
  - neutrino_vector_NOSYS
  - weight_total_NOSYS
  - weight_mc_NOSYS
