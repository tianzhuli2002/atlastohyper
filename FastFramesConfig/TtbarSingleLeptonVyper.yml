general:
  debug_level: INFO
  input_filelist_path: "/home/leet/FF/metadata_sim_cali_10_6/filelist.txt"
  input_sumweights_path: "/home/leet/FF/metadata_sim_cali_10_6/sum_of_weights.txt"
  output_path_histograms: "/data/leet/FFTutorial/output_histograms_SL_29_7"
  output_path_ntuples: "/data/leet/FFTutorial/output_ntuples_SL_29_7_test"
  default_sumweights: "NOSYS" # Default sum of weights for the samples. This is used to calculate the scaling to the luminosity.
  default_event_weights: "weight_mc_NOSYS * weight_pileup_NOSYS * weight_leptonSF_tight_NOSYS * weight_jvt_effSF_NOSYS" #* weight_ftag_effSF_GN2v01_Continuous_NOSYS"
  default_reco_tree_name: "reco" # Name of the reco tree in the input files.
  xsection_files: # Location of the cross-section, k-factor, filter-efficiency medatada split per campaign.
    - campaigns: ["mc20a", "mc20d", "mc20e"]
      files:
        - /cvmfs/atlas.cern.ch/repo/sw/database/GroupData/dev/PMGTools/PMGxsecDB_mc23.txt
        - /cvmfs/atlas.cern.ch/repo/sw/database/GroupData/dev/PMGTools/PMGxsecDB_mc16.txt
    - campaigns: ["mc23a","mc23d","mc23e"]
      files:
        - /cvmfs/atlas.cern.ch/repo/sw/database/GroupData/dev/PMGTools/PMGxsecDB_mc23.txt
        - /cvmfs/atlas.cern.ch/repo/sw/database/GroupData/dev/PMGTools/PMGxsecDB_mc16.txt
  luminosity: # Luminosity for the campaigns
    mc23a: 29049.3 # update?
    mc23d: 27239.9 # update?
    mc23e: 109400.0
  automatic_systematics: False
  nominal_only: True # Run with/without systematics.
  #config_define_after_custom_class : True
  split_processing_per_unique_samples: True # Process each unique sample in a separate process. This can speed up the processing if you have many samples and enough CPU cores.
  use_rvec: True # Use ROOT::RVec instead of std::vector.
  number_of_cpus: 16 # CPU cores to use for the analysis.
  use_region_subfolders: False # Save the histograms in subfolders per region.
  custom_frame_name: "PartonMatcher"
  custom_options:
    class_name: "TtbarSingleLeptonFrameVyper"
  #custom_frame_name: "TtbarDileptonFrameReco" # Name of the custom class.
  create_tlorentz_vectors_for: ["jet", "el", "mu"] # Create TLorentzVectors for the specified objects.
  # custom_options: # Use this to pass custom options to the custom class.
  #   metadata_histogram_name: metadata_ttbardilepton
  #   run_tag: ttbarDilepton_v1
  #   runner: Tim

regions:
  - name: "Electron_total"
    selection: "pass_ejets_NOSYS"
    variables: 
      # CUTS HISTOGRAMS
      - name: passed_ejets
        title: "histo title;X axis title;Y axis title"
        definition: pass_ejets_NOSYS
        type: char
        binning:
          min: 0
          max: 2
          number_of_bins: 2
      - name: passed_basic
        title: "histo title;X axis title;Y axis title"
        definition: Electron_pass_basic_NOSYS
        type: bool
        binning:
          min: 0
          max: 2
          number_of_bins: 2
      - name: passed_triggers_el
        title: "histo title;X axis title;Y axis title"
        definition: Electron_pass_triggers_NOSYS
        type: bool
        binning:
          min: 0
          max: 2
          number_of_bins: 2
      - name: passed_triggerMatch
        title: "histo title;X axis title;Y axis title"
        definition: globalTriggerMatch_NOSYS
        type: char
        binning:
          min: 0
          max: 2
          number_of_bins: 2
      - name: nElectrons
        title: "histo title;X axis title;Y axis title"
        definition: nElectrons_tight_NOSYS
        type: int
        binning:
          min: 0
          max: 4
          number_of_bins: 4
      - name: nJets
        title: "Number of jets;Number of jets;Events"
        definition: nJets_good_NOSYS
        type: int
        binning:
          min: 0
          max: 10
          number_of_bins: 10

  - name: "Muon_total"
    selection: "pass_mujets_NOSYS"
    variables: 
      # CUTS HISTOGRAMS
      - name: passed_mujets
        title: "histo title;X axis title;Y axis title"
        definition: pass_mujets_NOSYS
        type: char
        binning:
          min: 0
          max: 2
          number_of_bins: 2
      - name: passed_basic
        title: "histo title;X axis title;Y axis title"
        definition: Muon_pass_basic_NOSYS
        type: bool
        binning:
          min: 0
          max: 2
          number_of_bins: 2
      - name: passed_triggers_mu
        title: "histo title;X axis title;Y axis title"
        definition: Muon_pass_triggers_NOSYS
        type: bool
        binning:
          min: 0
          max: 2
          number_of_bins: 2
      - name: passed_triggerMatch
        title: "histo title;X axis title;Y axis title"
        definition: globalTriggerMatch_NOSYS
        type: char
        binning:
          min: 0
          max: 2
          number_of_bins: 2
      - name: nMuons
        title: "histo title;X axis title;Y axis title"
        definition: nMuons_tight_NOSYS
        type: int
        binning:
          min: 0
          max: 4
          number_of_bins: 4
      - name: nJets
        title: "Number of jets;Number of jets;Events"
        definition: nJets_good_NOSYS
        type: int
        binning:
          min: 0
          max: 10
          number_of_bins: 10
      - name: Jets_fullyMatched
        title: "histo title;X axis title;Y axis title"
        definition: Jets_fullyMatched_NOSYS
        type: bool
        binning:
          min: 0
          max: 2
          number_of_bins: 2

ntuples:
  selection: (Electron_pass_basic_NOSYS || Muon_pass_basic_NOSYS) && Jets_fullyMatched_NOSYS
  branches:
    - eventNumber
    - Electron_pt
    - Electron_eta
    - Electron_phi
    - Electron_e
    - Electron_q
    - Muon_pt
    - Muon_eta
    - Muon_phi
    - Muon_e
    - Muon_q
    - Jet_pt
    - Jet_eta
    - Jet_phi
    - Jet_e
    - Jet_GN2v01_score
    # - Jet_SVmass
    - Jet_GN2v01_PCBT_quantile
    - nBjets_GN2v01_.+
    - Met_pt
    - Met_phi
    - Truth_.+_index
    - KLF_.+_index
    - nu_px
    - nu_py
    - nu_pz

samples:
# ttbar
